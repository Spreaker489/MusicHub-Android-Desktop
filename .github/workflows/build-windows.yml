name: Build Windows desktop

on:
  push:
    branches: [main]
    paths:
      - "windows/**"
      - "icon.png"
      - ".github/workflows/build-windows.yml"
  pull_request:
    branches: [main]
    paths:
      - "windows/**"
      - "icon.png"
      - ".github/workflows/build-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Windows ${{ matrix.arch }} installer
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [ia32, x64]

    defaults:
      run:
        working-directory: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Generate Windows icon
        run: npm run make-icon

      - name: Build installer
        run: npx electron-builder --win nsis --${{ matrix.arch }}

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: musichub-classic-windows-${{ matrix.arch }}
          path: windows/dist/*.exe
          if-no-files-found: error

      - name: Publish installer to v1.2.1 release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload v1.2.1 dist/*.exe --clobber --repo ${{ github.repository }}
