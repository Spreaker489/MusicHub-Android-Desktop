name: Build MusicHub Classic

on:
  push:
    branches:
      - main
      - musichub-classic-optimization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Install MusicHub launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp icon.png app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Build Debug APK only
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK and record its size
        id: apk
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/MusicHub-1.2.1-Classic-Universal.apk
          SIZE_BYTES=$(stat -c '%s' release/MusicHub-1.2.1-Classic-Universal.apk)
          SIZE_HUMAN=$(du -h release/MusicHub-1.2.1-Classic-Universal.apk | cut -f1)
          echo "size_bytes=$SIZE_BYTES" >> "$GITHUB_OUTPUT"
          echo "size_human=$SIZE_HUMAN" >> "$GITHUB_OUTPUT"
          echo "APK size: $SIZE_HUMAN ($SIZE_BYTES bytes)"

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: musichub-classic-debug
          path: release/MusicHub-1.2.1-Classic-Universal.apk
          if-no-files-found: error

      - name: Replace APK asset in existing v1.2.1 Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: MusicHub 1.2.1
          files: release/MusicHub-1.2.1-Classic-Universal.apk
          overwrite_files: true
          body: |
            # MusicHub 1.2.1

            **Download:** MusicHub-1.2.1-Classic-Universal.apk (Debug build from main).

            **APK size:** ${{ steps.apk.outputs.size_human }} (${{ steps.apk.outputs.size_bytes }} bytes).

            This Release contains the APK file itself, not a ZIP archive of the Actions artifact.

            Built by GitHub Actions. Physical-device playback and background behavior have not been certified for this build.
