name: Build MusicHub Classic

on:
  push:
    branches:
      - main
      - musichub-classic-optimization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Install MusicHub launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp icon.png app/src/main/res/drawable-nodpi/ic_launcher.png
          file app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Build Debug APK only
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Prepare APK for GitHub Release
        run: |
          mkdir -p release
          cp app/build/outputs/apk/debug/*.apk release/MusicHub-1.2.1-Classic-Universal.apk
          du -h release/*.apk

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: musichub-classic-debug
          path: release/MusicHub-1.2.1-Classic-Universal.apk
          if-no-files-found: error

      - name: Replace APK in existing v1.2.1 GitHub Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
# MusicHub 1.2.1

**Download:** MusicHub-1.2.1-Classic-Universal.apk (Debug build from main).

This Release contains the APK file itself, not a ZIP archive of the Actions artifact.

Built by GitHub Actions. Physical-device playback and background behavior have not been certified for this build.
EOF
          gh release upload v1.2.1 release/MusicHub-1.2.1-Classic-Universal.apk --clobber
          gh release edit v1.2.1 --notes-file release-notes.md
