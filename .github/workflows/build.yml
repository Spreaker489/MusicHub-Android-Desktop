name: Build MusicHub Classic

on:
  push:
    branches:
      - main
      - musichub-classic-optimization
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.4'

      - name: Install MusicHub launcher icon
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          cp icon.png app/src/main/res/drawable-nodpi/ic_launcher.png
          file app/src/main/res/drawable-nodpi/ic_launcher.png

      - name: Build Classic debug and optimized release APKs
        run: gradle assembleDebug assembleRelease --no-daemon --stacktrace

      - name: Report APK sizes
        run: |
          echo "APK output sizes:"
          find app/build/outputs/apk -type f -name '*.apk' -print0 |
            sort -z |
            xargs -0 -r du -h

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: musichub-classic-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload optimized release APK (unsigned)
        uses: actions/upload-artifact@v4
        with:
          name: musichub-classic-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
