plugins {
    id 'com.android.application'
}

android {
    namespace 'com.musichub.geckoview'
    compileSdk 34

    defaultConfig {
        applicationId 'com.musichub.geckoview'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '1.2.1'
    }

    // Classic is one installable APK. Keep all four ABIs for broad device
    // compatibility; compress native libraries to reduce the APK download size.
    splits {
        abi {
            enable false
        }
    }

    packaging {
        jniLibs {
            // Legacy packaging compresses GeckoView's large native .so files
            // inside the APK. Android extracts them during installation.
            useLegacyPackaging true
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
        }
        release {
            // CI uses the Android debug certificate so this optimized APK can
            // be installed for testing. Replace with a private release key
            // before publishing to users or expecting signature-stable updates.
            signingConfig signingConfigs.debug
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                    'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

configurations.configureEach {
    resolutionStrategy.force 'androidx.core:core:1.12.0'
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core:1.12.0'
    implementation 'androidx.media:media:1.7.0'
    implementation 'org.mozilla.geckoview:geckoview:143.0.20250908174027'
}
